name: Publish to PyPI

on:
  release:
    types: [published]

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
        with:
          fetch-depth: 0
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: pip install build twine
      - run: python -m build
      - name: Check built version matches the release tag
        env:
          TAG: ${{ github.event.release.tag_name }}
        run: |
          python - "${TAG#v}" <<'EOF'
          import email, pathlib, sys, tarfile, zipfile

          expected = sys.argv[1]
          files = sorted(pathlib.Path("dist").iterdir())
          if not files:
              print("::error::dist/ is empty")
              sys.exit(1)
          for f in files:
              if f.suffix == ".whl":
                  with zipfile.ZipFile(f) as z:
                      meta = z.read(next(n for n in z.namelist() if n.endswith(".dist-info/METADATA")))
              else:
                  with tarfile.open(f) as t:
                      member = next(m for m in t.getmembers() if m.name.count("/") == 1 and m.name.endswith("/PKG-INFO"))
                      meta = t.extractfile(member).read()
              version = email.message_from_bytes(meta)["Version"]
              if version != expected:
                  print(f"::error::{f.name} has metadata version {version}, expected {expected} from the release tag")
                  sys.exit(1)
              print(f"{f.name}: version {version}")
          EOF
      - run: twine check --strict dist/*
      - uses: actions/upload-artifact@v4
        with:
          name: dist
          path: dist/

  publish:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: pypi
      url: https://pypi.org/project/audiveris-py/
    permissions:
      id-token: write
    steps:
      - uses: actions/download-artifact@v4
        with:
          name: dist
          path: dist/
      - uses: pypa/gh-action-pypi-publish@release/v1
