[build-system]
requires = ["setuptools>=61"]
build-backend = "setuptools.build_meta"

[project]
name = "audiveris-py"
version = "0.1.0"
description = "Python wrapper around the Audiveris CLI for converting PDF/image scores to MusicXML"
readme = "README.md"
requires-python = ">=3.9"
license = { text = "AGPL-3.0-or-later" }
dependencies = []

[project.urls]
Homepage = "https://github.com/leonarduk/audiveris-py"
Audiveris = "https://github.com/Audiveris/audiveris"

[project.optional-dependencies]
test = ["pytest>=7"]

[project.scripts]
audiveris-py = "audiveris_py.__main__:main"

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["src"]
