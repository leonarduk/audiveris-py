[build-system]
requires = ["setuptools>=77", "setuptools-scm>=8"]
build-backend = "setuptools.build_meta"

[project]
name = "audiveris-py"
dynamic = ["version"]
description = "Python wrapper around the Audiveris CLI for converting PDF/image scores to MusicXML"
readme = "README.md"
requires-python = ">=3.9"
license = "AGPL-3.0-or-later"
license-files = ["LICENSE"]
keywords = ["audiveris", "omr", "optical music recognition", "musicxml", "sheet music"]
classifiers = [
    "Development Status :: 3 - Alpha",
    "Environment :: Console",
    "Intended Audience :: Developers",
    "Intended Audience :: End Users/Desktop",
    "Operating System :: OS Independent",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3 :: Only",
    "Topic :: Multimedia :: Sound/Audio",
    "Topic :: Scientific/Engineering :: Image Recognition",
]
dependencies = []

[project.urls]
Homepage = "https://github.com/leonarduk/audiveris-py"
Issues = "https://github.com/leonarduk/audiveris-py/issues"
Audiveris = "https://github.com/Audiveris/audiveris"

[project.optional-dependencies]
test = ["pytest>=7"]

[project.scripts]
audiveris-py = "audiveris_py.__main__:main"

[tool.setuptools.packages.find]
where = ["src"]

# Version comes from the git tag (v0.1.1 -> 0.1.1); untagged commits get a .devN version.
[tool.setuptools_scm]
fallback_version = "0.0.0"

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["src"]
